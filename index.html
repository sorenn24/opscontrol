<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Panel de Control Operativo de Sucursales — Gestión de tareas y turnos para líderes." />
  <title>OpsControl | Sucursal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/reset.css" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/app.css" />
  <link rel="stylesheet" href="components/Login/Login.css" />
  <link rel="stylesheet" href="components/LeaderDashboard/LeaderDashboard.css" />
  <link rel="stylesheet" href="components/AdminDashboard/AdminDashboard.css" />
  <link rel="stylesheet" href="components/TicketI24/TicketI24.css" />
  <link rel="stylesheet" href="components/Horarios/Horarios.css" />
  <link rel="stylesheet" href="components/Ventas/Ventas.css" />

  <style>
  /* ── SVG Icon utility ──────────────────────────────── */
  .icon { display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .icon svg { display:block; }

  /* ── Login overrides ───────────────────────────────── */
  .login-select-wrapper {
    position: relative;
    margin-bottom: var(--space-5);
  }
  .login-select-btn {
    width: 100%;
    min-height: var(--touch-min);
    background: var(--bg-surface-2);
    border: 2px solid var(--border-default);
    border-radius: var(--radius-md);
    padding: 0 var(--space-5);
    display: flex;
    align-items: center;
    gap: var(--space-3);
    cursor: pointer;
    transition: all var(--transition-base);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .login-select-btn:hover,
  .login-select-btn.open {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px var(--color-primary-glow);
    background: var(--bg-surface-3);
  }
  .login-select-btn-label {
    flex: 1;
    text-align: left;
    font-size: var(--font-size-base);
    font-weight: 500;
    color: var(--text-muted);
  }
  .login-select-btn-label.selected-label {
    color: var(--text-primary);
    font-weight: 600;
  }
  .login-select-btn-icon {
    transition: transform var(--transition-base);
    color: var(--text-muted);
  }
  .login-select-btn.open .login-select-btn-icon {
    transform: rotate(180deg);
  }

  /* Dropdown */
  .login-select-dropdown {
    position: absolute;
    top: calc(100% + var(--space-2));
    left: 0; right: 0;
    background: var(--bg-surface-2);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    overflow-y: auto;
    max-height: 250px;
    box-shadow: var(--shadow-lg);
    z-index: 100;
    animation: fadeInUp 180ms ease both;
  }
  .login-select-option {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-4) var(--space-5);
    cursor: pointer;
    transition: background var(--transition-fast);
    border-bottom: 1px solid var(--border-subtle);
    -webkit-tap-highlight-color: transparent;
  }
  .login-select-option:last-child { border-bottom: none; }
  .login-select-option:hover { background: var(--bg-surface-2); }
  .login-select-option.active { background: var(--color-primary-subtle); }
  .login-select-option-name {
    flex: 1;
    font-size: var(--font-size-base);
    font-weight: 600;
    color: var(--text-primary);
  }
  .login-select-option-role {
    font-size: var(--font-size-xs);
    color: var(--text-muted);
    font-weight: 400;
  }
  .login-select-divider {
    height: 1px;
    background: var(--border-default);
    margin: var(--space-1) 0;
  }

  /* ── User Management Modal (Admin) ─────────────────── */
  .user-mgmt-section {
    padding: 0 var(--space-5) var(--space-5);
    margin-top: var(--space-2);
  }
  .user-mgmt-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-4);
  }
  .user-mgmt-title {
    font-size: var(--font-size-base);
    font-weight: 700;
    color: var(--text-primary);
  }
  .add-leader-btn {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-2) var(--space-4);
    min-height: 40px;
    background: var(--color-primary-subtle);
    border: 1px solid var(--color-primary);
    border-radius: var(--radius-md);
    color: var(--color-primary);
    font-size: var(--font-size-sm);
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition-base);
    -webkit-tap-highlight-color: transparent;
  }
  .add-leader-btn:hover {
    background: var(--color-primary);
    color: #fff;
    box-shadow: 0 4px 12px var(--color-primary-glow);
  }
  .leader-row {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-4);
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    margin-bottom: var(--space-2);
    animation: fadeInUp 250ms ease both;
  }
  .leader-row-info { flex: 1; }
  .leader-row-name {
    font-size: var(--font-size-base);
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.2;
  }
  .leader-row-pin {
    font-size: var(--font-size-xs);
    color: var(--text-muted);
    font-weight: 500;
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: var(--space-1);
  }
  .leader-row-actions {
    display: flex;
    gap: var(--space-2);
  }
  .icon-btn {
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-sm);
    cursor: pointer;
    border: 1px solid var(--border-default);
    background: var(--bg-surface-2);
    color: var(--text-muted);
    transition: all var(--transition-fast);
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:hover { background: var(--bg-surface-3); color: var(--text-primary); }
  .icon-btn.danger:hover { background: var(--color-danger-subtle); border-color: var(--color-danger); color: var(--color-danger); }

  /* Leader form modal */
  .leader-form { display: flex; flex-direction: column; gap: var(--space-4); }
  .form-field { display: flex; flex-direction: column; gap: var(--space-2); }
  .form-label {
    font-size: var(--font-size-xs);
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  .form-input {
    width: 100%;
    min-height: var(--touch-min);
    background: var(--bg-surface-2);
    border: 2px solid var(--border-default);
    border-radius: var(--radius-md);
    padding: 0 var(--space-4);
    font-size: var(--font-size-base);
    font-weight: 500;
    color: var(--text-primary);
    transition: all var(--transition-base);
  }
  .form-input:focus {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px var(--color-primary-glow);
    outline: none;
    background: var(--bg-surface-3);
  }
  .form-hint {
    font-size: var(--font-size-xs);
    color: var(--text-disabled);
  }
  .form-actions {
    display: flex;
    gap: var(--space-3);
    margin-top: var(--space-2);
  }

  /* Admin tabs */
  .admin-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border-subtle);
    padding: 0 var(--space-5);
    background: var(--bg-surface);
  }
  .admin-tab-btn {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-4) var(--space-4);
    font-size: var(--font-size-sm);
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all var(--transition-base);
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .admin-tab-btn:hover { color: var(--text-primary); }
  .admin-tab-btn.active {
    color: var(--color-primary);
    border-bottom-color: var(--color-primary);
  }
  .admin-tab-panel { display: none; }
  .admin-tab-panel.active { display: block; }

  /* scrollable body for admin */
  .admin-body { overflow-y: auto; flex: 1; }

  /* empty leaders state */
  .no-leaders {
    padding: var(--space-8) var(--space-6);
    text-align: center;
    color: var(--text-muted);
    font-size: var(--font-size-sm);
  }

  /* avatar circle generic */
  .user-avatar-circle {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--color-primary-subtle);
    border: 2px solid var(--color-primary);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    color: var(--color-primary);
  }
  .user-avatar-circle.admin-av {
    background: var(--color-success-subtle);
    border-color: var(--color-success);
    color: var(--color-success);
  }

  /* pin dots preview */
  .pin-dots {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .pin-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-disabled);
  }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script>
  // ============================================================
  // SVG ICON LIBRARY
  // ============================================================
  const ICONS = {
    user: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
    userPlus: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>`,
    shield: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,

    eye: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`,
    eyeOff: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`,
    logout: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>`,
    refresh: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>`,
    chevronDown: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`,
    chevronRight: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`,
    check: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
    close: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
    plus: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
    edit: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
    trash: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>`,
    calendar: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
    sun: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`,
    moon: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`,
    clipboard: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>`,
    barChart: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>`,
    users: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
    warning: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
    checkCircle: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
    xCircle: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
    info: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
    package: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>`,
    dollar: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`,
    ticket: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v2z"/></svg>`,
    home: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
  };
  function icon(name, size=18, color='currentColor') {
    const svg = ICONS[name];
    if(!svg) return '';
    return svg.replace(/width="\d+"/, `width="${size}"`).replace(/height="\d+"/, `height="${size}"`);
  }

  // ============================================================
  // UTILS — dateUtils
  // ============================================================
  const DAY_NAMES_ES=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const MONTH_NAMES_ES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function getDayOfWeek(d=new Date()){return d.getDay();}
  function isMonday(d=new Date()){return getDayOfWeek(d)===1;}
  function isThursday(d=new Date()){return getDayOfWeek(d)===4;}
  function formatDateLong(d=new Date()){return `${DAY_NAMES_ES[d.getDay()]}, ${d.getDate()} de ${MONTH_NAMES_ES[d.getMonth()]} de ${d.getFullYear()}`;}
  function formatDateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  function parseDateKey(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
  function todayKey(){return formatDateKey(new Date());}

  // ============================================================
  // UTILS — storage
  // ============================================================
  const SK={DRAFTS:'opscontrol:drafts',SUBMISSIONS:'opscontrol:submissions',SESSION:'opscontrol:session',USERS:'opscontrol:users'};
  function _r(k,fb=null){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):fb;}catch{return fb;}}
  function _w(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
  function _rm(k){try{localStorage.removeItem(k);}catch{}}
  function saveSession(u){_w(SK.SESSION,u);}
  function loadSession(){return _r(SK.SESSION,null);}
  function clearSession(){_rm(SK.SESSION);}
  function saveDraft(r){const ds=_r(SK.DRAFTS,[]);const i=ds.findIndex(d=>d.userId===r.userId&&d.turno===r.turno&&d.dateKey===r.dateKey);if(i>=0)ds[i]=r;else ds.push(r);_w(SK.DRAFTS,ds);}
  function getDrafts(){return _r(SK.DRAFTS,[]);}

  // STORE — appState
  // ============================================================
  const _subs=new Map();
  let _st={currentUser:null,currentTurno:'T1',taskProgress:{},adminViewDate:null};
  function getState(){return{..._st};}
  function setState(patch){
    const prev=_st;_st={..._st,...patch};
    Object.keys(patch).forEach(k=>{_subs.get(k)?.forEach(fn=>fn(_st[k],prev[k]));});
    _subs.get('*')?.forEach(fn=>fn(_st,prev));
  }
  function subscribe(k,fn){if(!_subs.has(k))_subs.set(k,new Set());_subs.get(k).add(fn);return()=>_subs.get(k)?.delete(fn);}
  function resetTaskProgress(){setState({taskProgress:{}});}

  // ============================================================
  const TOAST_ICONS={success:'checkCircle',danger:'xCircle',warning:'warning',info:'info'};
  function showToast(msg,type='info',dur=3500){
    const c=document.getElementById('toast-container');if(!c)return;
    const t=document.createElement('div');
    t.className=`toast toast-${type}`;t.setAttribute('role','alert');
    t.innerHTML=`<span class="icon">${icon(TOAST_ICONS[type]||'info',16)}</span><span style="flex:1;line-height:1.4;">${msg}</span>`;
    c.appendChild(t);
    const tm=setTimeout(()=>_dismissToast(t),dur);
    t.addEventListener('click',()=>{clearTimeout(tm);_dismissToast(t);},{once:true});
  }
  function _dismissToast(t){t.classList.add('toast-exit');t.addEventListener('animationend',()=>t.remove(),{once:true});}

  // ============================================================
  // API SERVICE — fetch() real al backend Express + MongoDB
  // ============================================================
  const API_BASE = '/api';

  async function _apiFetch(endpoint, options={}){
    try{
      const res = await fetch(API_BASE + endpoint, {
        headers: {'Content-Type':'application/json', ...options.headers},
        credentials: 'include',
        ...options,
      });
      const data = await res.json();
      if(!res.ok) return {error: data.error || `Error ${res.status}`};
      return data;
    } catch(e){
      return {error: 'Sin conexión con el servidor.'};
    }
  }

  }

    const sc=_ldSubmitState==='success'?' state-success':_ldSubmitState==='error'?' state-error':_ldSubmitState==='offline'?' state-offline':' btn-primary';

      _ldSubmitState==='error'?`<span class="icon">${icon('xCircle',16)}</span><span>Error — Toca para reintentar</span>`:
      allDone?`<span class="icon">${icon('checkCircle',16)}</span><span>Guardar registro</span>`:
      `<span>Guardar avance (${checked}/${total})</span>`;
    return`<div class="submit-summary">

        t1: { reportado: found.t1?.reportado||0, justificado: found.t1?.justificado||0, faltante: found.t1?.faltante||0, sinTickets: (found.t1?.reportado===0 && found.t1?.justificado===0) },

  function _tkCalcTurno(tKey){

  // HORARIOS MODULE (GESTOR DE HORARIOS DINÁMICO)

  const HR_DIAS = ['Viernes','Sabado','Domingo','Lunes','Martes','Miercoles','Jueves'];
  const HR_SUCURSALES = [{code:'ORD', name:'Manuel Ordoñez'}, {code:'CUA', name:'Cuauhtémoc'}];

  let _hrContainer=null, _hrReadonly=false, _hrWeekOffset=0;
  let _hrEmpleados=[], _hrHorarios={ORD:null, CUA:null};
  let _hrSelectedChip=null; // {sucursal, dia, idx} for tap-to-move

  function _hrGetWeekInfo(offset=0){
    const now=new Date();
    now.setDate(now.getDate() + (offset*7));
    // Find the Friday of the current week
    const day = now.getDay(); // 0=Sun
    const diffToFri = day >= 5 ? day - 5 : day + 2; // days since last Friday
    const friday = new Date(now);
    friday.setDate(now.getDate() - diffToFri);

    const dates=[];
    for(let i=0;i<7;i++){
      const d=new Date(friday);
      d.setDate(friday.getDate()+i);
      dates.push(d);
    }
    const startDay = friday.getDate();
    const endDay = dates[6].getDate();
    const iso = friday.toISOString().slice(0,4) + '-W' + String(Math.ceil(((friday - new Date(friday.getFullYear(),0,1))/86400000+1)/7)).padStart(2,'0');
    return {
      weekKey: iso,
      label: `SEMANA ${String(startDay).padStart(2,'0')} AL ${String(endDay).padStart(2,'0')}`,
      dates,
      dateKeys: dates.map(d => d.toISOString().slice(0,10))
    };
  }

  async function _hrLoadWeek(){
    if(!_hrContainer) return;
    const wk = _hrGetWeekInfo(_hrWeekOffset);
    const [hORD, hCUA] = await Promise.all([
      apiFetchHorario(wk.weekKey, 'ORD'),
      apiFetchHorario(wk.weekKey, 'CUA')
    ]);
    _hrHorarios.ORD = hORD;
    _hrHorarios.CUA = hCUA;
    _hrRender();
  }

  function _hrBuildAsignaciones(suc){
    const wk = _hrGetWeekInfo(_hrWeekOffset);
    const existing = _hrHorarios[suc];
    return HR_DIAS.map((dia, i) => {
      const fecha = wk.dateKeys[i];
      if(existing){
        const found = existing.asignaciones?.find(a => a.dia === dia);
        if(found) return { dia, fecha, t1: found.t1 || [], t2: found.t2 || [], t3: found.t3 || [] };
      }
      return { dia, fecha, t1: [], t2: [], t3: [] };
    });
  }

  let _hrClipboard = null;
  function _hrAttachKeyboardEvents(){
    if(window._hrKeydownAttached) return;
    window._hrKeydownAttached = true;
    document.addEventListener('keydown', e => {
      if(!_hrContainer || _hrReadonly) return;
      if(e.ctrlKey || e.metaKey){
        if(e.key.toLowerCase() === 'c'){
          const hoveredChip = _hrContainer.querySelector('.horario-emp-chip:hover') || _hrContainer.querySelector('.horario-emp-chip.selected');
          if(hoveredChip){
            const nameEl = hoveredChip.querySelector('span');
            _hrClipboard = {
              empleado_id: hoveredChip.dataset.eid,
              nombre: hoveredChip.dataset.nombre || (nameEl ? nameEl.childNodes[0].textContent.trim() : ''),
              sucursal_origen: hoveredChip.dataset.origen
            };
            showToast(`${_hrClipboard.nombre} copiado(a)`, 'info', 1000);
          }
        }
        if(e.key.toLowerCase() === 'v' && _hrClipboard){
          const hoveredZone = _hrContainer.querySelector('.horario-turno-zone:hover') || _hrContainer.querySelector('.horario-turno-zone.drop-target-active');
          if(hoveredZone){
            const suc = hoveredZone.dataset.suc;
            const dia = hoveredZone.dataset.dia;
            const turno = hoveredZone.dataset.turno;
            const asig = _hrBuildAsignaciones(suc);
            const dayObj = asig.find(a => a.dia === dia);
            if(dayObj){
              dayObj[turno].push({
                empleado_id: _hrClipboard.empleado_id,
                nombre: _hrClipboard.nombre,
                sucursal_origen: _hrClipboard.sucursal_origen,
                es_cubrimiento: _hrClipboard.sucursal_origen !== suc
              });
              _hrUpdateLocalHorario(suc, asig);
              _hrRender();
              showToast(`${_hrClipboard.nombre} pegado(a) en ${dia} ${turno.toUpperCase()}`, 'success', 1000);
            }
          }
        }
      }
    });
  }

  function _hrAttachListeners(){
    if(!_hrContainer) return;
    // Week navigation
    _hrContainer.querySelector('#hr-prev-week')?.addEventListener('click', () => { _hrWeekOffset--; _hrLoadWeek(); });
    _hrContainer.querySelector('#hr-next-week')?.addEventListener('click', () => { _hrWeekOffset++; _hrLoadWeek(); });
    // Employee management modal
    _hrContainer.querySelector('#hr-emp-mgmt-btn')?.addEventListener('click', _hrOpenEmployeeModal);
    // Save buttons
    _hrContainer.querySelectorAll('.horario-save-suc-btn').forEach(btn => {
      btn.addEventListener('click', () => _hrSave(btn.dataset.suc));
    });
    if(_hrReadonly) return;
    // Remove chips
    _hrContainer.querySelectorAll('.horario-emp-remove').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const {suc, dia, turno, idx} = btn.dataset;
        const asig = _hrBuildAsignaciones(suc);
        const dayObj = asig.find(a => a.dia === dia);
        if(dayObj) {
          dayObj[turno].splice(Number(idx), 1);
          _hrUpdateLocalHorario(suc, asig);
          _hrRender();
        }
      });
    });
    // Add-to-day buttons (opens employee picker)
    _hrContainer.querySelectorAll('.horario-add-to-day').forEach(btn => {
      btn.addEventListener('click', () => {
        _hrOpenAssignDropdown(btn.dataset.suc, btn.dataset.dia, Number(btn.dataset.di), btn.dataset.turno);
      });
    });
    // Drag & Drop (Desktop)
    _hrContainer.querySelectorAll('.horario-emp-chip').forEach(chip => {
      chip.addEventListener('dragstart', e => {
        chip.classList.add('dragging');
        const nameEl = chip.querySelector('span');
        const nombre = chip.dataset.nombre || (nameEl ? nameEl.childNodes[0].textContent.trim() : '');
        e.dataTransfer.setData('text/plain', JSON.stringify({
          isBank: chip.dataset.isBank === 'true',
          nombre: nombre,
          suc: chip.dataset.suc, dia: chip.dataset.dia, turno: chip.dataset.turno, idx: Number(chip.dataset.idx),
          eid: chip.dataset.eid, origen: chip.dataset.origen
        }));
        e.dataTransfer.effectAllowed = chip.dataset.isBank === 'true' ? 'copy' : 'move';
      });
      chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
      // Tap-to-move (Mobile)
      chip.addEventListener('click', e => {
        if(window.matchMedia('(hover: none)').matches || window.innerWidth < 768){
          e.stopPropagation();
          const nameEl = chip.querySelector('span');
          const nombre = chip.dataset.nombre || (nameEl ? nameEl.childNodes[0].textContent.trim() : '');
          _hrSelectedChip = { 
            isBank: chip.dataset.isBank === 'true',
            nombre: nombre,
            eid: chip.dataset.eid, origen: chip.dataset.origen,
            suc: chip.dataset.suc, dia: chip.dataset.dia, turno: chip.dataset.turno, idx: Number(chip.dataset.idx) 
          };
          _hrContainer.querySelectorAll('.horario-emp-chip').forEach(c => c.classList.remove('selected'));
          chip.classList.add('selected');
        }
      });
    });
    _hrContainer.querySelectorAll('.horario-turno-zone').forEach(zone => {
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drop-target-active'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('drop-target-active'));
      zone.addEventListener('drop', e => {
        e.preventDefault();
        zone.classList.remove('drop-target-active');
        try {
          const data = JSON.parse(e.dataTransfer.getData('text/plain'));
          _hrMoveEmployee(data, zone.dataset.suc, zone.dataset.dia, zone.dataset.turno);
        } catch(err){}
      });
      // Tap-to-move destination
      zone.addEventListener('click', () => {
        if(_hrSelectedChip){
          _hrMoveEmployee(_hrSelectedChip, zone.dataset.suc, zone.dataset.dia, zone.dataset.turno);
          _hrSelectedChip = null;
        }
      });
    });
  }

  function _hrMoveEmployee(sourceData, toSuc, toDia, toTurno){
    const toAsig = _hrBuildAsignaciones(toSuc);
    const toDay = toAsig.find(a => a.dia === toDia);
    if(!toDay) return;

    let emp;
    if(sourceData.isBank){
      emp = {
        empleado_id: sourceData.eid,
        nombre: sourceData.nombre,
        sucursal_origen: sourceData.origen,
        es_cubrimiento: sourceData.origen !== toSuc
      };
    } else {
      const fromAsig = (sourceData.suc === toSuc) ? toAsig : _hrBuildAsignaciones(sourceData.suc);
      const fromDay = fromAsig.find(a => a.dia === sourceData.dia);
      if(!fromDay || !fromDay[sourceData.turno][sourceData.idx]) return;
      emp = { ...fromDay[sourceData.turno][sourceData.idx] };
      // Remove from source
      fromDay[sourceData.turno].splice(sourceData.idx, 1);
      if(sourceData.suc !== toSuc) _hrUpdateLocalHorario(sourceData.suc, fromAsig);
      emp.es_cubrimiento = (emp.sucursal_origen !== toSuc);
    }
    
    toDay[toTurno].push(emp);
    _hrUpdateLocalHorario(toSuc, toAsig);
    _hrRender();
    showToast(`${emp.nombre} agregado a ${toDia} ${toTurno.toUpperCase()}`, 'info', 2000);
  }

  function _hrUpdateLocalHorario(suc, asignaciones){
    const wk = _hrGetWeekInfo(_hrWeekOffset);
    if(!_hrHorarios[suc]){
      _hrHorarios[suc] = { weekKey: wk.weekKey, semana_label: wk.label, sucursal: suc, asignaciones };
    } else {
      _hrHorarios[suc].asignaciones = asignaciones;
    }
  }

  async function _hrSave(suc){
    const wk = _hrGetWeekInfo(_hrWeekOffset);
    const asig = _hrBuildAsignaciones(suc);
    const payload = {
      weekKey: wk.weekKey,
      semana_label: wk.label,
      sucursal: suc,
      asignaciones: asig
    };
    const btn = _hrContainer.querySelector(`.horario-save-suc-btn[data-suc="${suc}"]`);
    if(btn){ btn.disabled=true; btn.innerHTML=`<div class="spinner" style="width:16px;height:16px;border-width:2px;"></div> Guardando...`; }
    const res = await apiSaveHorario(payload);
    if(res.success){
      _hrHorarios[suc] = res.horario || payload;
      showToast(`Horario de ${suc} guardado correctamente`, 'success', 3000);
      _hrRender();
    } else {
      showToast(res.error || 'Error al guardar horario', 'danger');
      if(btn){ btn.disabled=false; btn.innerHTML=`${icon('check',14)} Guardar ${suc}`; }
    }
  }

  function _hrOpenAssignDropdown(suc, dia, di, turno){
    const root = _hrContainer.querySelector('#hr-assign-root');
    if(!root) return;
    const allEmps = _hrEmpleados.filter(e => e.activo !== false);
    root.innerHTML=`
    <div class="horario-assign-overlay" id="hr-assign-overlay"></div>
    <div class="horario-assign-dropdown">
      <div class="horario-assign-dropdown-header">
        <span class="horario-assign-dropdown-title">Asignar a ${dia} ${turno.toUpperCase()} — ${suc}</span>
        <button class="horario-assign-dropdown-close" id="hr-assign-close" type="button">${icon('close',18)}</button>
      </div>
      ${allEmps.map(emp => {
        const isCross = emp.sucursal_origen !== suc;
        return `<div class="horario-assign-emp-item" data-eid="${emp._id||emp.id}" data-nombre="${emp.nombre}" data-origen="${emp.sucursal_origen}">
          ${icon('user',14)} <span>${emp.nombre}</span>
          <span class="emp-suc-tag${isCross ? ' cross' : ''}">${emp.sucursal_origen}</span>
        </div>`;
      }).join('')}
    </div>`;
    root.querySelector('#hr-assign-overlay')?.addEventListener('click', () => { root.innerHTML=''; });
    root.querySelector('#hr-assign-close')?.addEventListener('click', () => { root.innerHTML=''; });
    root.querySelectorAll('.horario-assign-emp-item').forEach(item => {
      item.addEventListener('click', () => {
        const asig = _hrBuildAsignaciones(suc);
        const dayObj = asig.find(a => a.dia === dia);

        const newEmp = {

          sucursal_origen: item.dataset.origen,
          es_cubrimiento: item.dataset.origen !== suc
        };
        dayObj[turno].push(newEmp);
        _hrUpdateLocalHorario(suc, asig);
        root.innerHTML='';
        _hrRender();
      });
    });
  }

  function _hrAttachEmpModalListeners(modalRoot){
    modalRoot.querySelector('#emp-modal-close')?.addEventListener('click', () => { modalRoot.innerHTML=''; });
    modalRoot.querySelector('#emp-modal-overlay')?.addEventListener('click', e => {
      if(e.target.id === 'emp-modal-overlay') modalRoot.innerHTML='';
    });
    // Add employee
    modalRoot.querySelector('#emp-add-btn')?.addEventListener('click', async () => {
      const nameInp = modalRoot.querySelector('#emp-add-name');
      const sucSel = modalRoot.querySelector('#emp-add-suc');
      const nombre = nameInp?.value?.trim().toUpperCase();
      if(!nombre) { showToast('Ingresa un nombre', 'warning'); return; }
      const res = await apiCreateEmpleado({ nombre, sucursal_origen: sucSel.value });
      if(res.success){
        showToast(`${nombre} agregado a ${sucSel.value}`, 'success');
        _hrEmpleados = await apiFetchEmpleados();
        _hrRenderEmpModal(modalRoot);
      } else { showToast(res.error || 'Error al agregar', 'danger'); }
    });
    // Edit employee
    modalRoot.querySelectorAll('.emp-edit-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const newName = prompt('Nuevo nombre:', btn.dataset.nombre);
        if(!newName || !newName.trim()) return;

          _hrEmpleados = await apiFetchEmpleados();
          _hrRenderEmpModal(modalRoot);
        } else { showToast(res.error || 'Error al editar', 'danger'); }
      });
    });
    // Delete (soft delete) employee
    modalRoot.querySelectorAll('.emp-del-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(!confirm(`¿Dar de baja a "${btn.dataset.nombre}"? Ya no aparecerá en los horarios nuevos.`)) return;

        if(res.success){

          _hrRenderEmpModal(modalRoot);
        } else { showToast(res.error || 'Error al dar de baja', 'danger'); }
      });
    });
  }

  function _adRenderStats(){
    const bar=_adContainer?.querySelector('#admin-stats-bar');
    if(!bar)return;
    const complete=_adReports.filter(r=>r.t1?.submitted||r.t2?.submitted).length;
    const both=_adReports.filter(r=>r.t1?.submitted&&r.t2?.submitted).length;
    const pending=_adReports.length-complete;
    bar.innerHTML=`
    <div class="stat-card" style="animation-delay:0ms;"><div class="stat-value" style="color:var(--color-success);">${complete}</div><div class="stat-label">Con registro</div></div>
    <div class="stat-card" style="animation-delay:60ms;"><div class="stat-value" style="color:var(--color-primary);">${both}</div><div class="stat-label">Ambos turnos</div></div>
    <div class="stat-card" style="animation-delay:120ms;"><div class="stat-value" style="color:var(--color-danger);">${pending}</div><div class="stat-label">Sin registro</div></div>`;
  }

  function _adRenderMatrix(){
    const grid=_adContainer?.querySelector('#leader-grid');
    if(!grid)return;
    if(_adLoading){grid.innerHTML=_adSkeletonGrid();return;}
    if(!_adReports.length){grid.innerHTML=`<div class="empty-state" style="grid-column:1/-1;padding:var(--space-12) var(--space-6);">${icon('users',40)}<p style="margin-top:var(--space-4);color:var(--text-muted);">Sin líderes registrados</p></div>`;return;}
    grid.innerHTML=_adReports.map((r,i)=>{
      const t1=r.t1?.submitted,t2=r.t2?.submitted;
      let sc='status-pending',dot='🔴';
      if(t1&&t2){sc='status-complete';dot='🟢';}
      else if(t1||t2){sc='status-partial';dot='🟡';}
      const t1l=t1?`${r.t1.completed}/${r.t1.total}`:'—';
      const t2l=t2?`${r.t2.completed}/${r.t2.total}`:'—';
      return`<div class="leader-card ${sc}" data-lid="${r.userId}" role="button" tabindex="0" style="animation-delay:${i*80}ms;">
        <div class="leader-card-avatar" style="color:var(--${sc==='status-complete'?'color-success':sc==='status-partial'?'color-warning':'color-danger'})">${icon('user',26)}</div>
        <div class="leader-card-name">${r.name}</div>
        <div class="leader-card-status-row">
          <div class="turno-pills">
            <span class="turno-pill turno-pill-t1${t1?' done':' none'}">${icon('sun',10)} T1 ${t1l}</span>
            <span class="turno-pill turno-pill-t2${t2?' done':' none'}">${icon('moon',10)} T2 ${t2l}</span>
          </div>
        </div>
        <div class="leader-card-semaphore">${dot}</div>
        <div class="leader-card-tap-hint">Toca para ver detalle</div>
      </div>`;
    }).join('');
    _adContainer?.querySelectorAll('.leader-card').forEach(card=>{
      const h=()=>{const r=_adReports.find(x=>x.userId===card.dataset.lid);if(r)_adOpenModal(r);};
      card.addEventListener('click',h);
      card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();h();}});
    });
  }

  function _adSkeletonStats(){return Array(3).fill('').map(()=>`<div class="stat-card"><div class="skeleton" style="width:48px;height:30px;margin:0 auto var(--space-2);"></div><div class="skeleton" style="width:80px;height:12px;margin:0 auto;"></div></div>`).join('');}

  async function _tkAdminLoad(){
    const root = _adContainer?.querySelector('#ticket-i24-admin-root');
    if(!root) return;
    root.innerHTML = `<div style="padding:40px;text-align:center;"><div class="spinner" style="margin:0 auto;border-color:var(--color-primary);border-bottom-color:transparent;"></div></div>`;
    const [users, tickets] = await Promise.all([
      apiGetUsers(),
      apiFetchTickets(_adDateKey)
    ]);
    _tkAdminRender(root, users.filter(u => u.role === 'leader'), tickets);
  }

  function _tkAdminRender(root, leaders, tickets){
    if(!root) return;
    let totalMissing = 0;
    tickets.forEach(t => {
      if(t.tiene_tickets){
        totalMissing += (t.t1?.faltante||0) + (t.t2?.faltante||0) + (t.t3?.faltante||0);
      }
    });
    const fmt = n => `$${Number(n||0).toLocaleString('es-MX')}`;

    root.innerHTML = `
    <div style="padding: var(--space-4) var(--space-4) var(--space-12); max-width: 900px; margin: 0 auto;">
      <div class="ticket-admin-kpi">
        <div class="ticket-kpi-info">
          <span class="ticket-kpi-label">Faltante Total Acumulado (${formatDateLong(parseDateKey(_adDateKey))})</span>
          <span class="ticket-kpi-value">${fmt(totalMissing)}</span>
        </div>
        <div style="opacity: 0.2; transform: scale(2);">${icon('dollar', 32, '#ffffff')}</div>
      </div>

      ${leaders.map(u => {
        const branches = u.branches || [];
        if(!branches.length) return '';
        return `
        <div class="ticket-admin-leader-group">
          <div class="ticket-admin-leader-header">
            ${icon('user', 16)} <span>${u.name}</span> <span style="font-size:11px;font-weight:600;color:var(--text-disabled);">(${branches.length} sucursales)</span>
          </div>
          <div class="ticket-branch-cards-grid">
            ${branches.map(b => {
              const t = tickets.find(x => x.sucursal === b);
              let badgeClass = 'pendiente', badgeText = 'Pendiente', details = 'Sin registro el día de hoy';
              if(t){
                if(!t.tiene_tickets){
                  badgeClass = 'sin-tickets'; badgeText = 'Sin Tickets i24'; details = 'Reportó <strong>$0</strong> en tickets';
                } else {
                  badgeClass = 'registrado'; badgeText = 'Registrado';
                  const f1 = t.t1?.faltante||0, f2 = t.t2?.faltante||0, f3 = t.t3?.faltante||0;
                  const totF = f1 + f2 + f3;
                  details = `T1: ${fmt(t.t1?.reportado)} | T2: ${fmt(t.t2?.reportado)} | T3: ${fmt(t.t3?.reportado)}<br/>Faltante total: <strong style="color:${totF>0?'var(--color-danger)':'var(--color-success)'}">${fmt(totF)}</strong>`;
                  if(t.tiene_nota && t.nota_texto) details += `<br/><em>📝 "${t.nota_texto}"</em>`;
                }
              }
              return `
              <div class="ticket-branch-card">
                <div class="ticket-branch-card-top">
                  <span class="ticket-branch-name">🏢 ${b}</span>
                  <span class="ticket-branch-badge ${badgeClass}">${badgeText}</span>
                </div>
                <div class="ticket-branch-details">${details}</div>
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }

    mc.querySelector('#modal-close-btn')?.addEventListener('click',closeModal);

    mc.querySelector('#modal-overlay')?.addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeModal();});
    mc.querySelector('#lf-save')?.addEventListener('click', async ()=>{
      const n=mc.querySelector('#lf-name')?.value?.trim();
      const p=mc.querySelector('#lf-pin')?.value?.trim();
      const errEl=mc.querySelector('#lf-error');
      if(!n||n.length<2){errEl.textContent='El nombre debe tener al menos 2 caracteres.';errEl.style.display='flex';return;}
      if(!p||p.length<4||!/^\d+$/.test(p)){errEl.textContent='El PIN debe ser numérico y tener mínimo 4 dígitos.';errEl.style.display='flex';return;}

  function _adModalTurno(report,turno){
    const data=turno==='T1'?report.t1:report.t2;
    const label=turno==='T1'?'Turno 1 — Mañana':'Turno 2 — Tarde';
    const ico=turno==='T1'?'sun':'moon';
    if(!data?.submitted)return`
    <div class="modal-turno-section">
      <div class="modal-turno-header">
        <span class="modal-turno-title"><span class="icon" style="display:inline-flex;margin-right:6px;vertical-align:middle;">${icon(ico,15)}</span>${label}</span>
        <span class="badge badge-danger">Sin registro</span>
      </div>
      <div class="modal-no-data"><span class="modal-no-data-icon icon">${icon('clipboard',32)}</span><span class="modal-no-data-text">No se registró actividad en este turno</span></div>
    </div>`;
    const ids=Object.keys(data.tasks);
    const time=data.submittedAt?new Date(data.submittedAt).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}):'';
    const done=Object.values(data.tasks).filter(Boolean).length;
    const pct=Math.round(done/ids.length*100);
    const dayTasks=getTasksForTurno(turno,parseDateKey(_adDateKey));
    const tmap=Object.fromEntries(dayTasks.map(t=>[t.id,t]));
    return`
    <div class="modal-turno-section">
      <div class="modal-turno-header">
        <span class="modal-turno-title"><span class="icon" style="display:inline-flex;margin-right:6px;vertical-align:middle;">${icon(ico,15)}</span>${label}</span>
        <div style="display:flex;align-items:center;gap:var(--space-2);">
          ${pct===100?`<span class="badge badge-success">${icon('checkCircle',11)} Completo</span>`:`<span class="badge badge-warning">${pct}%</span>`}
          ${time?`<span class="modal-turno-meta">${icon('check',11)} ${time}</span>`:''}
        </div>
      </div>
      <div class="task-progress-bar-wrap" style="margin-bottom:var(--space-4);">
        <div class="task-progress-bar-fill" style="width:${pct}%;"></div>
      </div>
      <div>
        ${ids.map(id=>{
          const chk=data.tasks[id];
          const lbl=tmap[id]?.label||id;
          return`<div class="modal-task-row">
            <div class="modal-task-dot ${chk?'done':'pending'}">${icon(chk?'check':'close',11)}</div>
            <span class="modal-task-label${chk?'':' pending-text'}">${lbl}</span>
            <span style="font-size:11px;font-weight:600;color:var(--${chk?'color-success':'color-danger'});">${chk?'Hecho':'Pendiente'}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  let _vxState = { fecha: todayKey(), sucursal: '', turno: '', nombre: '', apellido: '', foto_base64: null, monto: '', loading: false, error: '' };

  async function apiUploadVentaExtraordinaria(data) {
    const r = await fetch('/api/ventas', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    if(!r.ok) {
      const err = await r.json();
      throw new Error(err.error || 'Error al subir');
    }
    return await r.json();
  }

        <h2 class="vx-login-title"><span class="icon">${icon('dollar',32)}</span> Detalles de la Venta</h2>
        <div style="margin-bottom:24px; text-align:center; font-size:14px; color:var(--text-muted); background:var(--bg-surface-2); padding:8px; border-radius:12px;">
          <b>${_vxState.nombre} ${_vxState.apellido}</b> &nbsp;|&nbsp; ${_vxState.sucursal} - ${_vxState.turno}
        </div>

        <div class="vx-input-group">
          <label class="vx-input-label">Monto de Venta ($)</label>
          <div style="position:relative;">
            <span style="position:absolute; left:16px; top:50%; transform:translateY(-50%); font-weight:800; color:var(--color-primary); font-size:18px;">$</span>
            <input type="number" id="vx-monto" class="vx-input" style="padding-left:36px;font-size:18px;font-weight:700;" value="${_vxState.monto}" placeholder="Ej. 350.00">
          </div>
        </div>

        <div class="vx-input-group">
          <label class="vx-input-label">Fotografía del Ticket</label>
          <div class="vx-image-preview" id="vx-img-trigger">
            ${_vxState.foto_base64 ? `<img src="${_vxState.foto_base64}" />` : `<div class="vx-image-preview-placeholder">${icon('camera',40)}<span>Toca para tomar foto o elegir de la galería</span></div>`}
          </div>
          <input type="file" id="vx-file" class="vx-file-input" accept="image/*">
        </div>

        ${_vxState.error ? `<div class="login-error" style="margin-bottom:16px"><span class="icon">${icon('warning',16)}</span><span>${_vxState.error}</span></div>` : ''}

        <button id="vx-submit-btn" class="vx-btn-primary" type="button" ${_vxState.loading?'disabled':''}>
          ${_vxState.loading ? `<div class="spinner"></div> Subiendo...` : `${icon('upload',18)} Registrar Venta`}
        </button>
        <button id="vx-back-form-btn" class="vx-btn-secondary" type="button" ${_vxState.loading?'disabled':''}>${icon('chevronLeft',18)} Volver atrás</button>
      </div>
    `;

    document.getElementById('vx-img-trigger').addEventListener('click', () => document.getElementById('vx-file').click());
    
    document.getElementById('vx-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      _vxState.monto = document.getElementById('vx-monto').value;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const max_w = 800; const max_h = 1000;
          let width = img.width; let height = img.height;
          if (width > height) { if (width > max_w) { height *= max_w / width; width = max_w; } }
          else { if (height > max_h) { width *= max_h / height; height = max_h; } }
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          _vxState.foto_base64 = canvas.toDataURL('image/jpeg', 0.7);
          _renderVxForm(container);
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('vx-submit-btn').addEventListener('click', async () => {
      _vxState.monto = document.getElementById('vx-monto').value;
      if(!_vxState.monto || Number(_vxState.monto) < 300) {
        _vxState.error = 'El monto debe ser numérico y mayor o igual a $300.';
        _renderVxForm(container); return;
      }
      if(!_vxState.foto_base64) {
        _vxState.error = 'Por favor toma una fotografía del ticket.';
        _renderVxForm(container); return;
      }

      _vxState.loading = true; _vxState.error = ''; _renderVxForm(container);
      try {
        await apiUploadVentaExtraordinaria({
          fecha_ticket: _vxState.fecha,
          sucursal: _vxState.sucursal,
          turno: _vxState.turno,
          empleado_nombre: _vxState.nombre,
          empleado_apellido: _vxState.apellido,
          monto: Number(_vxState.monto),
          foto_base64: _vxState.foto_base64
        });
        container.innerHTML = `
          <div class="vx-form-container" style="text-align:center;">
            <div style="color:var(--color-success); margin-bottom:24px;">${icon('checkCircle',64)}</div>
            <h2 class="vx-login-title">¡Venta Registrada!</h2>
            <p style="color:var(--text-secondary); font-size:15px; margin-bottom:32px;">Tu ticket ha sido enviado exitosamente para validación.</p>
            <button class="vx-btn-primary" onclick="mountVxLogin(document.getElementById('root'))">Registrar otro ticket</button>
          </div>
        `;
      } catch (err) {
        _vxState.loading = false; _vxState.error = err.message;
        _renderVxForm(container);
      }
    });

    document.getElementById('vx-back-form-btn')?.addEventListener('click', () => {
      _vxState.monto = document.getElementById('vx-monto').value;
      _renderVxLogin(container);
    });
  }

  // ============================================================
  let _vxPanelState = { ventas: [], loading: false, date: todayKey().substring(0, 7), sucursal: '', turno: '', nombre: '' };

  async function mountVxPanel(container) {
    if(!container) return;
    _vxPanelState.loading = true;
    _renderVxPanel(container);
    try {
      _vxPanelState.ventas = await apiGetVentasExtraordinarias({ date: _vxPanelState.date, sucursal: _vxPanelState.sucursal, turno: _vxPanelState.turno, nombre: _vxPanelState.nombre });
    } catch(e) { console.error(e); }
    _vxPanelState.loading = false;
    _renderVxPanel(container);
  }

  async function apiGetVentasExtraordinarias(filters) {
    const q = new URLSearchParams(filters).toString();
    const r = await fetch(`/api/ventas?${q}`);
    const d = await r.json();
    return d.ventas || [];
  }

  async function apiValidarVenta(id, estado) {
    const r = await fetch(`/api/ventas/${id}/validar`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({estado_validacion: estado})
    });
    if(!r.ok) throw new Error('Error al validar');
    return await r.json();
  }

  async function apiDeleteVenta(id) {
    const r = await fetch(`/api/ventas/${id}`, { method: 'DELETE' });
    if(!r.ok) throw new Error('Error al eliminar');
    return await r.json();
  }

  function _renderVxPanel(container) {
    if(!container) return;
    const { currentUser } = getState();
    const isAd = currentUser?.role === 'admin';
    const allBranches = ['ORD','CUA','LN2','INS','SMB','PL2','EC2','AVM','ROD','LNO','MTU','MTC','BTJ','RS2','RCS','ANT'];
    const branches = isAd ? allBranches : (currentUser?.branches || []);

    const total = _vxPanelState.ventas.length;
    const sum = _vxPanelState.ventas.reduce((acc, v) => acc + (Number(v.monto) || 0), 0);

    container.innerHTML = `
      <div style="padding-top:16px;">
        <div class="vx-panel-header">
          <div class="vx-filters" style="display:flex; flex-wrap:wrap; gap:8px;">
            <input type="month" id="vx-filter-date" class="vx-input" style="height:36px;padding:0 12px;width:auto;" value="${_vxPanelState.date}">
            <select id="vx-filter-suc" class="vx-input" style="height:36px;padding:0 12px;width:auto;padding-right:32px;background-position:right 8px center;">
              <option value="">Todas las sucursales</option>
              ${branches.map(b => `<option value="${b}" ${_vxPanelState.sucursal===b?'selected':''}>${b}</option>`).join('')}
            </select>
            <select id="vx-filter-tur" class="vx-input" style="height:36px;padding:0 12px;width:auto;padding-right:32px;background-position:right 8px center;">
              <option value="">Todos los turnos</option>
              <option value="T1" ${_vxPanelState.turno==='T1'?'selected':''}>T1</option>
              <option value="T2" ${_vxPanelState.turno==='T2'?'selected':''}>T2</option>
              <option value="T3" ${_vxPanelState.turno==='T3'?'selected':''}>T3</option>
            </select>
            <input type="text" id="vx-filter-nom" class="vx-input" placeholder="Nombre..." style="height:36px;padding:0 12px;width:120px;" value="${_vxPanelState.nombre}">
            <button id="vx-filter-btn" class="btn btn-secondary" style="height:36px;display:flex;align-items:center;gap:4px;">${icon('refresh',14)} Filtrar</button>
          </div>
        </div>

        <div class="vx-kpi-container">
          <div class="vx-kpi-card">
            <div class="vx-kpi-label">Tickets Registrados</div>
            <div class="vx-kpi-value">${total}</div>
          </div>
          <div class="vx-kpi-card">
            <div class="vx-kpi-label">Suma Total ($)</div>
            <div class="vx-kpi-value">$${sum.toLocaleString('es-MX')}</div>
          </div>
        </div>

        ${_vxPanelState.loading ? `<div style="text-align:center;padding:40px;"><div class="spinner"></div></div>` : ''}

        ${!_vxPanelState.loading && _vxPanelState.ventas.length === 0 ? `
          <div style="text-align:center;padding:40px;color:var(--text-muted)">
            <div style="margin-bottom:16px;">${icon('ticket',40)}</div>
            No hay ventas extraordinarias registradas para esta selección.
          </div>
        ` : ''}

        <div class="vx-grid">
          ${_vxPanelState.ventas.map(v => `
            <div class="vx-card">
              <div class="vx-card-header">
                <span style="font-size:12px;font-weight:600;">${v.sucursal} - ${v.turno}</span>
                <span class="vx-card-badge ${v.estado_validacion}">${v.estado_validacion}</span>
              </div>
              <div class="vx-card-img-wrapper" data-img="${v.foto_base64}">
                <img src="${v.foto_base64}" class="vx-card-img" />
                <div style="position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.6);color:white;padding:4px;border-radius:4px;">${icon('eye',14)}</div>
              </div>
              <div class="vx-card-body">
                <div class="vx-card-title">${v.empleado_nombre} ${v.empleado_apellido}</div>
                <div class="vx-card-monto" style="font-size: 16px; font-weight: 700; word-break: break-all;">$${Number(v.monto).toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2})}</div>
                <div class="vx-card-meta">Registrado: ${new Date(v.createdAt).toLocaleTimeString()}</div>
              </div>
              <div class="vx-card-actions">
                <button class="vx-action-btn validar" data-id="${v._id}" ${v.estado_validacion==='VALIDADO'?'disabled style="opacity:0.5"':''}>${icon('check',14)}</button>
                <button class="vx-action-btn rechazar" data-id="${v._id}" ${v.estado_validacion==='RECHAZADO'?'disabled style="opacity:0.5"':''}>${icon('close',14)}</button>
                <button class="vx-action-btn eliminar" data-id="${v._id}" style="color:var(--color-danger);">${icon('trash',14)}</button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
      <div id="vx-modal-root"></div>
    `;

    document.getElementById('vx-filter-btn')?.addEventListener('click', () => {
      _vxPanelState.date = document.getElementById('vx-filter-date').value;
      _vxPanelState.sucursal = document.getElementById('vx-filter-suc').value;
      _vxPanelState.turno = document.getElementById('vx-filter-tur').value;
      _vxPanelState.nombre = document.getElementById('vx-filter-nom').value.trim();
      mountVxPanel(container);
    });

    container.querySelectorAll('.vx-card-img-wrapper').forEach(w => {
      w.addEventListener('click', () => {
        const modal = document.getElementById('vx-modal-root');
        if(modal) {
          modal.innerHTML = `
            <div class="vx-lightbox">
              <button class="vx-lightbox-close">${icon('close',24)}</button>
              <img src="${w.dataset.img}" class="vx-lightbox-img" />
            </div>
          `;
          modal.querySelector('.vx-lightbox-close').addEventListener('click', () => modal.innerHTML = '');
        }
      });
    });

    container.querySelectorAll('.vx-action-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const actionBtn = e.currentTarget;
        const id = actionBtn.dataset.id;

        if (actionBtn.classList.contains('eliminar')) {
          if(confirm('¿Seguro que deseas eliminar este registro de Venta Extraordinaria?')) {
            actionBtn.innerHTML = '<div class="spinner" style="width:14px;height:14px;border-width:2px;margin:0 auto"></div>';
            try {
              await apiDeleteVenta(id);
              mountVxPanel(container);
              showToast('Venta eliminada correctamente.', 'success');
            } catch(err) {
              showToast('Error: ' + err.message, 'error');
              actionBtn.innerHTML = icon('trash',14);
            }
          }
          return;
        }

        const nuevoEstado = actionBtn.classList.contains('validar') ? 'VALIDADO' : 'RECHAZADO';
        actionBtn.innerHTML = '<div class="spinner" style="width:14px;height:14px;border-width:2px;margin:0 auto"></div>';
        try {
          await apiValidarVenta(id, nuevoEstado);
          mountVxPanel(container);
          showToast(`Ticket ${nuevoEstado.toLowerCase()}.`, nuevoEstado === 'VALIDADO' ? 'success' : 'info');
        } catch(err) {
          showToast('Error: ' + err.message, 'error');
          mountVxPanel(container);
        }
      });
    });
  }

  // ============================================================
  // APP BOOTSTRAP
  // ============================================================
  (function init(){
    const root=document.getElementById('root');
    if(!root)return;
    const saved=loadSession();
    if(saved)setState({currentUser:saved});
    subscribe('currentUser',(user,prev)=>{
      if(prev){try{unmountLeaderDashboard();}catch{}try{unmountAdminDashboard();}catch{}};
      _mountView(root);
    });
    _mountView(root);
  })();

  function _mountView(root){
    const{currentUser}=getState();
    if(!currentUser){mountLogin(root);return;}
    if(currentUser.role==='admin'){mountAdminDashboard(root);return;}
    mountLeaderDashboard(root);
  }
  </script>
</body>
</html>
